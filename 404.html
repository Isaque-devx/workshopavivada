<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#080511">
  <title>404 | Workshop de Louvor & Adoração</title>
  <meta name="description" content="A página que você tentou acessar não foi encontrada.">
  <link rel="icon" type="image/svg+xml" href="assets/logos/logo-icon.svg">

  <link rel="preload" as="font" type="font/woff" href="assets/fonts/hero-new-regular.woff" crossorigin>
  <link rel="preload" as="font" type="font/woff" href="assets/fonts/hero-new-extrabold.woff" crossorigin>

  <style>
    @font-face {
      font-family: "Hero New";
      src: url("assets/fonts/hero-new-regular.woff") format("woff");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "Hero New";
      src: url("assets/fonts/hero-new-extrabold.woff") format("woff");
      font-weight: 800;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --bg: #080511;
      --purple: #7b4ff5;
      --purple-dark: #560ff3;
      --white: #ffffff;
      --muted: rgba(255, 255, 255, 0.72);
      --line: rgba(255, 255, 255, 0.18);
      --font: "Hero New", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--bg);
    }

    body {
      min-height: 100%;
      margin: 0;
      overflow-x: hidden;
      color: var(--white);
      background: var(--bg);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    a {
      color: inherit;
    }

    .page {
      position: relative;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(32px, 6vw, 72px) 20px;
      overflow: hidden;

      background-image:
        linear-gradient(
          180deg,
          rgba(8, 5, 17, 0.48) 0%,
          rgba(8, 5, 17, 0.58) 48%,
          rgba(8, 5, 17, 0.94) 100%
        ),
        url("assets/images/hero-bg-poster.jpg");
      background-position: center center;
      background-size: cover;
      background-repeat: no-repeat;
    }

    .content {
      width: min(100%, 880px);
      margin-inline: auto;
      text-align: center;
    }

    .brand {
      display: inline-flex;
      margin-bottom: clamp(18px, 3vw, 28px);
    }

    .brand img {
      display: block;
      width: 48px;
      height: 48px;
    }

    .code {
      margin: 0;
      color: var(--white);
      font-size: clamp(5.5rem, 19vw, 11rem);
      font-weight: 800;
      letter-spacing: -0.08em;
      line-height: 0.78;
    }

    h1 {
      max-width: 720px;
      margin: clamp(24px, 4vw, 38px) auto 0;
      font-size: clamp(2rem, 5.2vw, 3.7rem);
      font-weight: 800;
      letter-spacing: -0.045em;
      line-height: 1.02;
    }

    h1 span {
      color: var(--white);
    }

    .message {
      width: min(100%, 560px);
      margin: 18px auto 0;
      color: var(--muted);
      font-size: clamp(1rem, 2vw, 1.1rem);
      line-height: 1.65;
    }

    .actions {
      width: min(100%, 600px);
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin: clamp(28px, 4vw, 36px) auto 0;
    }

    .btn {
      min-height: 50px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 13px 20px;
      border: 1px solid var(--line);
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 800;
      line-height: 1.2;
      text-decoration: none;
      transition: transform 160ms ease, background-color 160ms ease, border-color 160ms ease;
    }

    .btn--primary {
      border-color: var(--purple);
      background: var(--purple);
    }

    .btn--secondary {
      background: rgba(8, 5, 17, 0.55);
    }

    .btn:hover {
      transform: translateY(-1px);
    }

    .btn--primary:hover {
      background: var(--purple-dark);
      border-color: var(--purple-dark);
    }

    .btn--secondary:hover {
      border-color: rgba(255, 255, 255, 0.42);
      background: rgba(255, 255, 255, 0.06);
    }

    .btn:focus-visible {
      outline: 3px solid rgba(123, 79, 245, 0.65);
      outline-offset: 3px;
    }

    .event {
      width: min(100%, 700px);
      margin: clamp(38px, 6vw, 58px) auto 0;
      padding-top: 22px;
      border-top: 1px solid var(--line);
    }

    .event__title {
      margin: 0;
      font-size: clamp(0.95rem, 2vw, 1.15rem);
      font-weight: 800;
      letter-spacing: 0.07em;
      text-transform: uppercase;
    }

    .event__title span {
      color: var(--purple);
    }

    .event__meta {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px 22px;
      margin-top: 9px;
      color: rgba(255, 255, 255, 0.68);
      font-size: 0.88rem;
      line-height: 1.5;
    }

    .event__meta strong {
      color: var(--white);
    }

    @media (max-width: 640px) {
      .page {
        min-height: 100svh;
        align-items: flex-start;
        padding: 28px 16px 32px;
        overflow: visible;
        background-position: 62% center;
      }

      .content {
        padding-top: 4px;
      }

      .brand {
        margin-bottom: 18px;
      }

      .brand img {
        width: 42px;
        height: 42px;
      }

      .code {
        font-size: clamp(5.2rem, 27vw, 8rem);
        line-height: 0.82;
      }

      h1 {
        margin-top: 24px;
        font-size: clamp(1.85rem, 8.5vw, 2.8rem);
      }

      .message {
        margin-top: 14px;
        font-size: 0.98rem;
        line-height: 1.6;
      }

      .actions {
        grid-template-columns: 1fr;
        width: 100%;
        margin-top: 26px;
      }

      .btn {
        width: 100%;
        min-height: 48px;
      }

      .event {
        margin-top: 38px;
        padding-top: 18px;
      }

      .event__meta {
        flex-direction: column;
        gap: 5px;
      }
    }

    @media (max-width: 400px) {
      .page {
        padding-inline: 14px;
      }

      .code {
        font-size: 5.2rem;
      }

      h1 {
        font-size: 1.75rem;
      }

      .event__meta {
        font-size: 0.82rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .btn {
        transition: none;
      }

      .btn:hover {
        transform: none;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <div class="content">
      <a class="brand" href="/" aria-label="Voltar para a página inicial">
        <img src="assets/logos/logo-icon.svg" alt="">
      </a>

      <p class="code" aria-hidden="true">404</p>

      <h1>
        Página <span>não encontrada.</span>
      </h1>

      <p class="message">
        A página que você tentou acessar não existe ou foi movida.
      </p>

      <div class="actions">
        <a class="btn btn--primary" href="/">
          Voltar ao início
        </a>

        <a
          class="btn btn--secondary"
          href="https://www.e-inscricao.com/igreja-crist-avivada/workshopniveaisabella"
          target="_blank"
          rel="noopener noreferrer"
        >
          Quero me inscrever
        </a>
      </div>

      <section class="event" aria-label="Informações do workshop">
        <p class="event__title">
          Workshop <span>Nívea Izabella</span>
        </p>

        <div class="event__meta">
          <span><strong>26 de setembro de 2026</strong></span>
          <span>15h às 18h</span>
          <span>Igreja Cristã Avivada · Timóteo - MG</span>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
